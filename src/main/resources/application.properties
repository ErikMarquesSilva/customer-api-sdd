spring.application.name=customer-api-sdd

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customers}
spring.datasource.username=${DB_USERNAME:customers}
spring.datasource.password=${DB_PASSWORD:customers}
# Keep PostgreSQL error detail (e.g. the duplicated email or cpf) out of exception messages and logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
