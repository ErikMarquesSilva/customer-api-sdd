spring.application.name=customer-api-sdd

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customers}
spring.datasource.username=${DB_USERNAME:customers}
spring.datasource.password=${DB_PASSWORD:customers}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
